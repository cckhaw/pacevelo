name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint app components lib db
      # Fail PRs on new high/critical advisories in production dependencies.
      # The @vercel/blob -> @vercel/oidc -> @vercel/cli-config chain has no
      # non-breaking fix yet, so it is excluded until a patched release lands.
      - name: npm audit (production, high+)
        run: |
          npm audit --omit=dev --audit-level=high --json > audit.json || true
          node -e '
            const a = require("./audit.json");
            const ignored = new Set(["@vercel/blob","@vercel/oidc","@vercel/cli-config","zod"]);
            const bad = Object.values(a.vulnerabilities || {}).filter(
              (v) => ["high","critical"].includes(v.severity) && !ignored.has(v.name)
            );
            if (bad.length) { console.error("High/critical advisories:", bad.map((v) => v.name).join(", ")); process.exit(1); }
          '
      - name: Build
        env:
          DATABASE_URL: postgres://placeholder:placeholder@localhost/placeholder
          SESSION_SECRET: ci-placeholder-secret-at-least-32-characters-long
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: npm run build
