name: Deploy production

# Production only: Vercel's own Git integration is disabled in vercel.json
# ("git.deploymentEnabled": false), so no preview deployments are ever built.
# Every merge/push to main builds and deploys here instead, and once the new
# deployment is live the cleanup workflow deletes all older deployments.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_CLI_VERSION: "52.0.0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      deployment_url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check required secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID DATABASE_URL; do
            if [ -z "${!name}" ] && [ -z "$(printenv "$name")" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          [ -z "${missing:-}" ]

      - run: npm ci

      # The app reads columns added by recent migrations (e.g. profiles.session_version),
      # so the schema must be current *before* the new code goes live.
      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate:ci

      - name: Pull Vercel production settings
        run: npx --yes vercel@${VERCEL_CLI_VERSION} pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build (production)
        run: npx --yes vercel@${VERCEL_CLI_VERSION} build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      # `vercel deploy` blocks until the deployment is READY (live).
      - name: Deploy to production
        id: deploy
        run: |
          url=$(npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $url" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    needs: deploy
    permissions: {}
    uses: ./.github/workflows/vercel-deployment-cleanup.yml
    with:
      confirm_cleanup: true
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
