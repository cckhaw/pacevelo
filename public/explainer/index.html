<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaceVelo Explainer</title>
<style>
  @font-face { font-family: "Nunito"; src: url("nunito.woff2") format("woff2"); font-weight: 200 1000; }
  :root { --bg: #0B1220; --fg: #E2E8F0; --accent: #00F2FE; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: "Nunito", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  #stage { width: min(100vw - 32px, (100vh - 90px) * 16 / 9); aspect-ratio: 16 / 9; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  #stage > svg { display: block; width: 100%; height: 100%; }
  #controls { display: flex; align-items: center; gap: 12px; width: min(100vw - 32px, (100vh - 90px) * 16 / 9); }
  #controls button { font: 800 15px "Nunito", sans-serif; background: var(--accent); color: #0B1220; border: 0; border-radius: 999px; padding: 8px 18px; cursor: pointer; }
  #scrub { flex: 1; accent-color: var(--accent); }
  #clock { font: 700 14px ui-monospace, monospace; min-width: 90px; text-align: right; }
  body.render { display: block; background: #fff; }
  body.render #stage { width: 1920px; height: 1080px; border-radius: 0; box-shadow: none; }
  body.render #controls { display: none; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="controls">
  <button id="play">Pause</button>
  <input id="scrub" type="range" min="0" max="90" step="0.01" value="0" aria-label="Seek">
  <span id="clock">0:00 / 1:30</span>
</div>
<script src="explainer.js"></script>
<script>
  const stage = document.getElementById("stage");
  const render = (t) => { stage.innerHTML = PV.frame(t); };
  window.renderAt = render;
  if (new URLSearchParams(location.search).has("render")) {
    document.body.classList.add("render");
    render(0);
  } else {
    const btn = document.getElementById("play"), scrub = document.getElementById("scrub"), clock = document.getElementById("clock");
    const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
    let t = 0, playing = true, last = performance.now();
    const loop = (now) => {
      if (playing) { t += (now - last) / 1000; if (t >= PV.DURATION) t = 0; }
      last = now;
      render(t);
      scrub.value = t;
      clock.textContent = `${fmt(t)} / ${fmt(PV.DURATION)}`;
      requestAnimationFrame(loop);
    };
    btn.onclick = () => { playing = !playing; btn.textContent = playing ? "Pause" : "Play"; };
    scrub.oninput = () => { t = +scrub.value; };
    document.addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); btn.click(); } });
    requestAnimationFrame(loop);
  }
</script>
</body>
</html>
